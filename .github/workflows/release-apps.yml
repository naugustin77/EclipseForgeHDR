# The desktop apps: a Mac app (Apple silicon and Intel) and a Windows program,
# built from the tagged source and attached to the GitHub release, so people
# can download and double-click instead of installing Python.
# Runs when a tag v* is pushed (e.g. git tag v0.32.0 && git push origin v0.32.0),
# or by hand from the Actions tab (then the files stay with the run as artifacts).
name: desktop apps
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple silicon
          - os: macos-13          # Intel
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the app and the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pywebview
      - name: Inno Setup for the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, start once, package
        run: python packaging/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: release/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
